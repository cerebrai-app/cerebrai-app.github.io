name: PR screenshot cleanup

# Deletes a pull request's screenshots from cerebrai-app/automated-screenshots when the
# pull request is closed or merged, so they do not stay public after the review is over.
# Uses the same GitHub App and secrets as pr-screenshot.yml, with Contents read/write on
# the screenshots repository. It runs no code from the pull request and checks nothing out.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  SCREENSHOTS_REPO: cerebrai-app/automated-screenshots

jobs:
  cleanup:
    # PRs from forks never publish screenshots (see pr-screenshot.yml), so there is nothing to delete.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shares a group with the publish job, so a run still publishing waits for this one
    # (or the other way round) instead of recreating the files after they are deleted.
    concurrency:
      group: pr-screenshot-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      APP_CLIENT_ID: ${{ secrets.SCREENSHOT_APP_CLIENT_ID }}
    steps:
      - name: Warn when the app credentials are missing
        if: ${{ env.APP_CLIENT_ID == '' }}
        run: echo "::warning::Secret SCREENSHOT_APP_CLIENT_ID is not set, so no screenshots were deleted."

      - name: Create app token for the screenshots repository
        id: app-token
        if: ${{ env.APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.SCREENSHOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: automated-screenshots
          permission-contents: write

      - name: Delete the screenshots
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          dir="${GITHUB_REPOSITORY#*/}/pr-${PR_NUMBER}"

          # Deletes one file from main through the contents API.
          delete_file() {
            local path="$1" sha
            # Other pull requests commit to the same branch, so retry if main moved underneath us.
            for attempt in 1 2 3 4 5; do
              # A delete needs the file's current sha, which is read again on every attempt.
              sha="$(gh api "repos/${SCREENSHOTS_REPO}/contents/${path}?ref=main" --jq .sha 2> /dev/null || true)"
              if [[ -z "$sha" ]]; then
                return 0 # already gone
              fi
              if gh api --method DELETE "repos/${SCREENSHOTS_REPO}/contents/${path}" \
                -f message="Delete screenshots for ${GITHUB_REPOSITORY} PR #${PR_NUMBER}" \
                -f branch=main -f sha="$sha" > /dev/null; then
                return 0
              fi
              echo "Delete of $path failed (attempt $attempt), retrying..." >&2
              sleep $((attempt * 2))
            done
            return 1
          }

          if ! listing="$(gh api "repos/${SCREENSHOTS_REPO}/contents/${dir}?ref=main" --jq '.[] | select(.type == "file") | .path' 2>&1)"; then
            if grep -q "HTTP 404" <<< "$listing"; then
              echo "No screenshots for PR #${PR_NUMBER}; nothing to delete."
              exit 0
            fi
            echo "$listing" >&2
            exit 1
          fi

          while read -r path; do
            [[ -n "$path" ]] || continue
            echo "Deleting $path"
            delete_file "$path"
          done <<< "$listing"
