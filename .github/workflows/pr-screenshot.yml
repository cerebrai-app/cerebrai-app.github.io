name: PR screenshot

# Builds the pull request, captures the home page, and posts the screenshots in
# a PR comment as attachments (`gh pr comment --attach`).
#
# GitHub does not accept the built-in GITHUB_TOKEN for attachment uploads, so the
# comment is posted as a GitHub App. Needs two secrets (repository or
# organization level):
#   SCREENSHOT_APP_CLIENT_ID    the app's Client ID (on its settings page, "Iv...")
#   SCREENSHOT_APP_PRIVATE_KEY  the app's private key (the whole .pem file)
# The app must be installed on this repository with read/write on Contents and
# Pull requests. Until the secrets exist the comment job only prints a warning;
# the screenshots are still available as a workflow artifact.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-screenshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's code runs below; don't leave the token where it can read it.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build site
        run: pnpm run build
      - name: Capture home page
        run: pnpm run screenshot

      - name: Upload screenshots as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: home-page-screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SCREENSHOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCREENSHOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Comment on the PR
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh auth status
          set -euo pipefail

          # gh uploads the attached files and points these image references at them.
          body="<!-- pr-screenshot -->
          ### Home page preview

          Built from $HEAD_SHA.

          **Desktop (1280×800)**

          ![Home page on desktop](screenshots/desktop.png)

          **Mobile (390×844)**

          ![Home page on mobile](screenshots/mobile.png)"

          url="$(gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" \
            --attach screenshots/desktop.png --attach screenshots/mobile.png)"
          echo "Posted $url"

          new_id="${url##*issuecomment-}"
          if [[ ! "$new_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read the new comment's id, so earlier comments were left in place."
            exit 1
          fi

          # Replace, rather than add to, the comments from earlier runs.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- pr-screenshot -->"))) | .id' |
            while read -r id; do
              if [[ "$id" != "$new_id" ]]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
              fi
            done
