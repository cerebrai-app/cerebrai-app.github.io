name: Prune old PR screenshots

on:
  schedule:
    - cron: '17 3 * * 0' # Sundays
  workflow_dispatch:

permissions:
  contents: write

env:
  SCREENSHOT_BRANCH: pr-screenshots

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Delete screenshots older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prune-screenshot-store.sh --older-than 30
