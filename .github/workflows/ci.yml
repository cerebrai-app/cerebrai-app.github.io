name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per PR (or per branch/tag for pushes). A new commit on a PR cancels
# its previous run; runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run check
      - name: ESLint
        run: pnpm run lint
      - name: Prettier
        run: pnpm run format:check
      # Self-hosted runners don't come with jq, which the script tests use.
      - uses: cerebrai-app/actions/setup-jq@9d3f590b4cd4b83ad4da88c7f14f61b1100c6430 # v3.3.0
      - name: Script tests
        run: pnpm run test
