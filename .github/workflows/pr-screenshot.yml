name: PR screenshot

# Builds the pull request, captures the home page, and posts the screenshots in
# a PR comment as attachments (`gh pr comment --attach`).
#
# GitHub does not accept the built-in GITHUB_TOKEN for attachment uploads, so the
# comment is posted as a GitHub App. Needs two secrets (repository or
# organization level):
#   SCREENSHOT_APP_CLIENT_ID    the app's Client ID (on its settings page, "Iv...")
#   SCREENSHOT_APP_PRIVATE_KEY  the app's private key (the whole .pem file)
# The app must be installed on this repository with read/write on Contents and
# Pull requests. Until the secrets exist the comment job only prints a warning;
# the screenshots are still available as a workflow artifact.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-screenshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's code runs below; don't leave the token where it can read it.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build site
        run: pnpm run build
      - name: Capture home page
        run: pnpm run screenshot

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SCREENSHOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCREENSHOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Comment on the PR
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # 1. Directly hit GitHub's upload endpoint to bypass the CLI token check

          MIME=image/png
          FILE=./screenshots/desktop.png
          REPOSITORY_ID=$(gh api "repos/${{ github.repository }}" --jq .id)

          echo "Asset endpoint: https://uploads.github.com/user-attachments/assets?name=${FILE}&content_type=${MIME}&repository_id=${REPOSITORY_ID}"
          UPLOAD_RESP=$(curl -s "https://uploads.github.com/user-attachments/assets?name=${FILE}&content_type=${MIME}&repository_id=${REPOSITORY_ID}" \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/json" --data-binary "@$FILE")
          echo "Upload response for desktop: $UPLOAD_RESP"
          DESKTOP_URL=$(echo "$UPLOAD_RESP" | jq -r '.url')
          MOBILE_URL=$(echo "$UPLOAD_RESP" | jq -r '.url')

          # UPLOAD_RESP=$(curl -s -X POST "${{ github.api_url }}/repos/${{ github.repository }}/environments/assets" \
          #   -H "Authorization: Bearer $GH_TOKEN" \
          #   -H "Accept: application/vnd.github+json" \
          #   -H "Content-Type: application/octet-stream" \
          #   --data-binary @./screenshots/desktop.png)
          # echo "Upload response for desktop: $UPLOAD_RESP"
          # DESKTOP_URL=$(echo "$UPLOAD_RESP" | jq -r '.url')

          # UPLOAD_RESP=$(curl -s -X POST "${{ github.api_url }}/repos/${{ github.repository }}/environments/assets" \
          #   -H "Authorization: Bearer $GH_TOKEN" \
          #   -H "Accept: application/vnd.github+json" \
          #   -H "Content-Type: application/octet-stream" \
          #   --data-binary @./screenshots/mobile.png)
          # echo "Upload response for mobile: $UPLOAD_RESP"
          # MOBILE_URL=$(echo "$UPLOAD_RESP" | jq -r '.url')

          # gh uploads the attached files and points these image references at them.
          body="<!-- pr-screenshot -->
          ### Home page preview

          Built from $HEAD_SHA.

          **Desktop (1280×800)**

          ![Home page on desktop]($DESKTOP_URL)

          **Mobile (390×844)**

          ![Home page on mobile]($MOBILE_URL)"

          url="$(gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body")"
          echo "Posted $url"

          new_id="${url##*issuecomment-}"
          if [[ ! "$new_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read the new comment's id, so earlier comments were left in place."
            exit 1
          fi

          # Replace, rather than add to, the comments from earlier runs.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- pr-screenshot -->"))) | .id' |
            while read -r id; do
              if [[ "$id" != "$new_id" ]]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
              fi
            done
